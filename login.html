<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Вход — K-STREET</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@400;700;900&family=Inter:wght@400;500;600;700&family=Noto+Sans+KR:wght@400;700;900&display=swap" rel="stylesheet">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
:root {
  --bg:           #0a0c18;
  --bg-2:         #12152a;
  --bg-3:         #1a1e38;
  --neon-pink:    #ff2ea6;
  --neon-violet:  #9b4dff;
  --neon-blue:    #3ecbff;
  --yellow:       #ffd400;
  --text:         #ffffff;
  --text-muted:   #9a9db5;
  --border:       rgba(255, 46, 166, 0.18);
  --radius:       18px;
  --radius-sm:    12px;
  --shadow-pink:  0 0 24px rgba(255, 46, 166, 0.45);
  --error:        #ff4d6d;
}

* { margin: 0; padding: 0; box-sizing: border-box; }
html { scroll-behavior: smooth; }

body {
  font-family: 'Inter', 'Noto Sans KR', sans-serif;
  background: var(--bg);
  color: var(--text);
  line-height: 1.55;
  min-height: 100vh;
  overflow-x: hidden;
}

body::before {
  content: '';
  position: fixed;
  inset: 0;
  background:
    radial-gradient(circle at 15% 20%, rgba(155, 77, 255, 0.22), transparent 45%),
    radial-gradient(circle at 85% 70%, rgba(255, 46, 166, 0.18), transparent 45%),
    radial-gradient(circle at 50% 100%, rgba(62, 203, 255, 0.10), transparent 50%);
  pointer-events: none;
  z-index: 0;
}

img { max-width: 100%; display: block; }
a { text-decoration: none; color: inherit; }
button { font-family: inherit; cursor: pointer; border: none; background: none; color: inherit; }
input { font-family: inherit; }

.container {
  width: 100%;
  max-width: 1200px;
  margin: 0 auto;
  padding: 0 20px;
  position: relative;
  z-index: 1;
}

/* ШАПКА */
.header {
  position: sticky;
  top: 0;
  z-index: 100;
  background: rgba(10, 12, 24, 0.85);
  backdrop-filter: blur(14px);
  -webkit-backdrop-filter: blur(14px);
  border-bottom: 1px solid var(--border);
}
.header-inner {
  display: flex;
  align-items: center;
  justify-content: space-between;
  height: 84px;
}
.logo {
  display: flex;
  align-items: center;
  gap: 12px;
}
.logo-img {
  height: 64px;
  width: auto;
  filter: drop-shadow(0 0 10px rgba(255, 212, 0, 0.3));
}
.logo-text {
  font-family: 'Unbounded', sans-serif;
  font-weight: 900;
  font-size: 22px;
  color: var(--yellow);
  text-shadow: 0 0 16px rgba(255, 212, 0, 0.45);
}
.back-link {
  font-size: 14px;
  color: var(--text-muted);
  transition: 0.2s;
}
.back-link:hover { color: var(--neon-pink); }

/* ОБЁРТКА */
.auth-wrap {
  min-height: calc(100vh - 84px);
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 40px 20px;
  position: relative;
  z-index: 1;
}
.auth-card {
  width: 100%;
  max-width: 440px;
  background: var(--bg-2);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 40px 36px;
  box-shadow:
    0 0 40px rgba(255, 46, 166, 0.15),
    0 20px 60px rgba(0, 0, 0, 0.5);
  position: relative;
  overflow: hidden;
}
.auth-card::before {
  content: '';
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 3px;
  background: linear-gradient(90deg, var(--neon-pink), var(--neon-violet), var(--neon-blue));
  box-shadow: 0 0 20px rgba(255, 46, 166, 0.6);
}
.auth-kr {
  font-family: 'Noto Sans KR', sans-serif;
  font-weight: 900;
  font-size: 26px;
  color: var(--neon-pink);
  text-align: center;
  text-shadow: 0 0 20px rgba(255, 46, 166, 0.6);
  margin-bottom: 4px;
  line-height: 1;
}
.auth-title {
  font-family: 'Unbounded', sans-serif;
  font-weight: 900;
  font-size: 26px;
  text-align: center;
  letter-spacing: -0.01em;
  margin-bottom: 8px;
}
.auth-subtitle {
  text-align: center;
  color: var(--text-muted);
  font-size: 14px;
  margin-bottom: 30px;
}

/* ЭКРАНЫ */
.auth-step { display: none; }
.auth-step.active {
  display: block;
  animation: fadeIn 0.3s ease;
}
@keyframes fadeIn {
  from { opacity: 0; transform: translateY(8px); }
  to   { opacity: 1; transform: translateY(0); }
}

/* ПОЛЯ */
.field { margin-bottom: 18px; }
.field-label {
  display: block;
  font-size: 12px;
  font-weight: 600;
  letter-spacing: 0.05em;
  text-transform: uppercase;
  color: var(--text-muted);
  margin-bottom: 8px;
}
.field-input {
  width: 100%;
  padding: 14px 18px;
  background: var(--bg-3);
  border: 1.5px solid rgba(255, 255, 255, 0.08);
  border-radius: var(--radius-sm);
  color: var(--text);
  font-size: 15px;
  transition: 0.25s;
  outline: none;
}
.field-input::placeholder { color: #5a5d75; }
.field-input:focus {
  border-color: var(--neon-pink);
  box-shadow: 0 0 0 3px rgba(255, 46, 166, 0.15);
}

/* PIN */
.pin-wrap {
  display: flex;
  gap: 12px;
  justify-content: center;
  margin-top: 4px;
}
.pin-input {
  width: 56px;
  height: 64px;
  text-align: center;
  font-family: 'Unbounded', sans-serif;
  font-weight: 900;
  font-size: 26px;
  color: var(--text);
  background: var(--bg-3);
  border: 1.5px solid rgba(255, 255, 255, 0.08);
  border-radius: var(--radius-sm);
  outline: none;
  transition: 0.25s;
  caret-color: var(--neon-pink);
}
.pin-input:focus {
  border-color: var(--neon-pink);
  box-shadow: 0 0 0 3px rgba(255, 46, 166, 0.15);
}
.pin-input.filled {
  border-color: var(--neon-pink);
  background: rgba(255, 46, 166, 0.08);
}

/* ОШИБКА */
.form-error {
  display: none;
  padding: 12px 16px;
  background: rgba(255, 77, 109, 0.1);
  border: 1px solid rgba(255, 77, 109, 0.35);
  border-radius: var(--radius-sm);
  color: var(--error);
  font-size: 13px;
  margin-bottom: 18px;
  line-height: 1.5;
}
.form-error.visible { display: block; }

/* КНОПКА */
.btn-submit {
  width: 100%;
  padding: 15px 24px;
  border-radius: 50px;
  background: var(--neon-pink);
  color: #fff;
  font-family: 'Unbounded', sans-serif;
  font-weight: 700;
  font-size: 13px;
  letter-spacing: 0.05em;
  text-transform: uppercase;
  box-shadow: 0 0 22px rgba(255, 46, 166, 0.5);
  transition: 0.25s;
  margin-top: 6px;
}
.btn-submit:hover {
  background: #ff54b8;
  box-shadow: 0 0 34px rgba(255, 46, 166, 0.85);
  transform: translateY(-2px);
}
.btn-submit:disabled {
  opacity: 0.5;
  cursor: not-allowed;
  transform: none;
  box-shadow: none;
}

/* ПОДСКАЗКА */
.hint {
  text-align: center;
  font-size: 12.5px;
  color: rgba(154, 157, 181, 0.6);
  margin-top: 14px;
  line-height: 1.6;
}
.hint code {
  font-family: 'Unbounded', sans-serif;
  font-weight: 700;
  font-size: 12px;
  color: rgba(255, 212, 0, 0.7);
  background: rgba(255, 212, 0, 0.08);
  padding: 2px 8px;
  border-radius: 6px;
  letter-spacing: 1px;
}

/* ИНФО О НОМЕРЕ */
.phone-info {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  padding: 12px 16px;
  background: var(--bg-3);
  border: 1px solid rgba(255, 46, 166, 0.2);
  border-radius: var(--radius-sm);
  margin-bottom: 22px;
}
.phone-info-number {
  font-family: 'Unbounded', sans-serif;
  font-weight: 700;
  font-size: 14px;
  color: var(--yellow);
  letter-spacing: 0.02em;
  word-break: break-all;
}
.phone-change {
  font-size: 12px;
  font-weight: 600;
  color: var(--neon-pink);
  transition: 0.2s;
  white-space: nowrap;
  flex-shrink: 0;
}
.phone-change:hover { text-shadow: 0 0 10px var(--neon-pink); }

/* БЛОК НОВОГО ПОЛЬЗОВАТЕЛЯ */
.new-user-block {
  display: none;
  margin-bottom: 18px;
  padding: 14px 16px;
  background: rgba(62, 203, 255, 0.06);
  border: 1px solid rgba(62, 203, 255, 0.25);
  border-radius: var(--radius-sm);
}
.new-user-block.visible { display: block; }
.new-user-title {
  font-size: 12px;
  font-weight: 600;
  letter-spacing: 0.04em;
  text-transform: uppercase;
  color: var(--neon-blue);
  margin-bottom: 10px;
}

@media (max-width: 720px) {
  .header-inner { height: 72px; }
  .logo-img { height: 52px; }
  .logo-text { font-size: 17px; }

  .auth-wrap { padding: 24px 16px; min-height: calc(100vh - 72px); }
  .auth-card { padding: 30px 22px; border-radius: 16px; }
  .auth-title { font-size: 22px; }
  .auth-kr { font-size: 22px; }

  .pin-input { width: 48px; height: 56px; font-size: 22px; }
  .pin-wrap { gap: 9px; }
  .phone-info-number { font-size: 13px; }
}

@media (max-width: 400px) {
  .logo-text { display: none; }
  .pin-input { width: 42px; height: 52px; font-size: 20px; }
  .pin-wrap { gap: 7px; }
}
</style>
</head>
<body>

<!-- ШАПКА -->
<header class="header">
  <div class="container header-inner">
    <a href="index.html" class="logo">
      <img src="img/logo.png" alt="K-STREET" class="logo-img">
      <span class="logo-text">K-STREET</span>
    </a>
    <a href="index.html" class="back-link">&#8592; На главную</a>
  </div>
</header>

<!-- ФОРМА -->
<div class="auth-wrap">
  <div class="auth-card">

    <p class="auth-kr">로그인</p>
    <h1 class="auth-title">Вход в аккаунт</h1>
    <p class="auth-subtitle">Войдите, чтобы оформлять заказы</p>

    <div class="form-error" id="formError"></div>

    <!-- ШАГ 1: ТЕЛЕФОН -->
    <div class="auth-step active" id="stepPhone">
      <form id="phoneForm" autocomplete="off">
        <div class="field">
          <label class="field-label" for="phoneInput">Номер телефона</label>
          <input
            type="tel"
            class="field-input"
            id="phoneInput"
            placeholder="+7 (___) ___-__-__"
            maxlength="18"
            inputmode="numeric"
          >
        </div>

        <button type="submit" class="btn-submit">Продолжить</button>

        <p class="hint">
          Тестовый номер: <code>+7 (900) 123-45-67</code>
        </p>
      </form>
    </div>

    <!-- ШАГ 2: PIN -->
    <div class="auth-step" id="stepPin">
      <div class="phone-info">
        <span class="phone-info-number" id="phoneDisplay"></span>
        <button type="button" class="phone-change" id="changePhone">Изменить номер</button>
      </div>

      <div class="new-user-block" id="newUserBlock">
        <p class="new-user-title">Регистрация нового гостя</p>
        <div class="field" style="margin-bottom: 0;">
          <label class="field-label" for="nameInput">Ваше имя</label>
          <input
            type="text"
            class="field-input"
            id="nameInput"
            placeholder="Например, Светлана"
            maxlength="30"
          >
        </div>
      </div>

      <div class="field">
        <label class="field-label" id="pinLabel">PIN-код</label>
        <div class="pin-wrap" id="pinWrap">
          <input type="password" class="pin-input" maxlength="1" inputmode="numeric">
          <input type="password" class="pin-input" maxlength="1" inputmode="numeric">
          <input type="password" class="pin-input" maxlength="1" inputmode="numeric">
          <input type="password" class="pin-input" maxlength="1" inputmode="numeric">
        </div>
      </div>

      <button type="button" class="btn-submit" id="codeSubmit" disabled>Войти</button>

      <p class="hint" id="pinHint">
        Введите ваш PIN-код
      </p>
    </div>

  </div>
</div>

<!-- ПОДКЛЮЧЕНИЕ SUPABASE -->
<script src="js/supabase-client.js"></script>

<script>
/* ============================================
   КОНСТАНТЫ
   ============================================ */
const CURRENT_USER_KEY = 'kstreet_user';

/* СОСТОЯНИЕ */
let currentPhone = '';
let isNewUser = false;

/* ============================================
   SUPABASE
   ============================================ */
async function findUserByPhone(phone) {
  const { data, error } = await supabaseClient
    .from('users')
    .select('*')
    .eq('phone', phone)
    .maybeSingle();

  if (error) {
    console.error('Ошибка поиска пользователя:', error);
    return null;
  }
  return data;
}

async function createUser(name, phone, pin) {
  const { data, error } = await supabaseClient
    .from('users')
    .insert({ name: name, phone: phone, pin: pin })
    .select()
    .single();

  if (error) {
    console.error('Ошибка создания пользователя:', error);
    return null;
  }
  return data;
}

/* ============================================
   МАСКА ТЕЛЕФОНА
   ============================================ */
function maskPhone(value) {
  const digits = value.replace(/\D/g, '');
  let d = digits;
  if (d.startsWith('8')) d = '7' + d.slice(1);
  if (d.startsWith('9')) d = '7' + d;
  if (!d.startsWith('7')) d = '7' + d;
  d = d.slice(0, 11);

  const p = d.slice(1);
  let result = '+7';
  if (p.length > 0) result += ' (' + p.slice(0, 3);
  if (p.length >= 3) result += ') ' + p.slice(3, 6);
  if (p.length >= 6) result += '-' + p.slice(6, 8);
  if (p.length >= 8) result += '-' + p.slice(8, 10);
  return result;
}

function normalizePhone(value) {
  let d = value.replace(/\D/g, '');
  if (d.startsWith('8')) d = '7' + d.slice(1);
  if (d.startsWith('9')) d = '7' + d;
  if (!d.startsWith('7')) d = '7' + d;
  d = d.slice(0, 11);
  return '+' + d;
}

function formatPhoneDisplay(normalized) {
  const p = normalized.slice(2);
  let result = '+7';
  if (p.length > 0) result += ' (' + p.slice(0, 3);
  if (p.length >= 3) result += ') ' + p.slice(3, 6);
  if (p.length >= 6) result += '-' + p.slice(6, 8);
  if (p.length >= 8) result += '-' + p.slice(8, 10);
  return result;
}

/* ============================================
   PIN
   ============================================ */
const pinWrap = document.getElementById('pinWrap');
const pinInputs = pinWrap.querySelectorAll('.pin-input');
const codeSubmit = document.getElementById('codeSubmit');

function getPinValue() {
  let pin = '';
  pinInputs.forEach(function (input) { pin += input.value; });
  return pin;
}

function clearPin() {
  pinInputs.forEach(function (input) {
    input.value = '';
    input.classList.remove('filled');
  });
  pinInputs[0].focus();
  updateSubmitState();
}

function updateSubmitState() {
  const pin = getPinValue();
  const hasName = !isNewUser || document.getElementById('nameInput').value.trim().length >= 2;
  codeSubmit.disabled = !(pin.length === 4 && hasName);
}

pinInputs.forEach(function (input, index) {
  input.addEventListener('input', function () {
    input.value = input.value.replace(/\D/g, '').slice(0, 1);
    if (input.value) {
      input.classList.add('filled');
      if (index < pinInputs.length - 1) {
        pinInputs[index + 1].focus();
      }
    } else {
      input.classList.remove('filled');
    }
    updateSubmitState();
  });

  input.addEventListener('keydown', function (e) {
    if (e.key === 'Backspace' && !input.value && index > 0) {
      pinInputs[index - 1].focus();
      pinInputs[index - 1].value = '';
      pinInputs[index - 1].classList.remove('filled');
      updateSubmitState();
    }
  });

  input.addEventListener('paste', function (e) {
    e.preventDefault();
    const text = (e.clipboardData || window.clipboardData).getData('text');
    const digits = text.replace(/\D/g, '').slice(0, 4).split('');
    digits.forEach(function (digit, i) {
      if (pinInputs[i]) {
        pinInputs[i].value = digit;
        pinInputs[i].classList.add('filled');
      }
    });
    const nextEmpty = Math.min(digits.length, pinInputs.length - 1);
    pinInputs[nextEmpty].focus();
    updateSubmitState();
  });
});

/* ============================================
   ОШИБКИ
   ============================================ */
const errorEl = document.getElementById('formError');

function showError(message) {
  errorEl.textContent = message;
  errorEl.classList.add('visible');
}
function hideError() {
  errorEl.classList.remove('visible');
}

/* ============================================
   ЭКРАНЫ
   ============================================ */
const stepPhone = document.getElementById('stepPhone');
const stepPin = document.getElementById('stepPin');

function goToPinStep() {
  stepPhone.classList.remove('active');
  stepPin.classList.add('active');
  hideError();
  setTimeout(function () { pinInputs[0].focus(); }, 100);
}

function goToPhoneStep() {
  stepPin.classList.remove('active');
  stepPhone.classList.add('active');
  hideError();
  clearPin();
  document.getElementById('nameInput').value = '';
  document.getElementById('newUserBlock').classList.remove('visible');
  isNewUser = false;
  document.getElementById('phoneInput').focus();
}

/* ============================================
   ШАГ 1: ТЕЛЕФОН
   ============================================ */
const phoneInput = document.getElementById('phoneInput');

document.getElementById('phoneForm').addEventListener('submit', async function (e) {
  e.preventDefault();
  hideError();

  const phone = normalizePhone(phoneInput.value.trim());

  if (phone.length !== 12) {
    showError('Введите корректный номер телефона');
    phoneInput.focus();
    return;
  }

  currentPhone = phone;

  // Ищем пользователя в Supabase
  const user = await findUserByPhone(phone);
  isNewUser = !user;

  document.getElementById('phoneDisplay').textContent = formatPhoneDisplay(phone);

  const newUserBlock = document.getElementById('newUserBlock');
  const pinLabel = document.getElementById('pinLabel');
  const pinHint = document.getElementById('pinHint');

  if (isNewUser) {
    newUserBlock.classList.add('visible');
    pinLabel.textContent = 'Придумайте PIN-код';
    pinHint.innerHTML = 'Придумайте PIN из 4 цифр — он понадобится для следующих входов';
  } else {
    newUserBlock.classList.remove('visible');
    pinLabel.textContent = 'PIN-код';
    pinHint.textContent = 'Введите ваш PIN-код';
  }

  goToPinStep();
});

/* ============================================
   ИЗМЕНИТЬ НОМЕР
   ============================================ */
document.getElementById('changePhone').addEventListener('click', function () {
  goToPhoneStep();
});

/* ============================================
   ВВОД ИМЕНИ
   ============================================ */
const nameInput = document.getElementById('nameInput');
nameInput.addEventListener('input', updateSubmitState);

/* ============================================
   ШАГ 2: ВОЙТИ / ЗАРЕГИСТРИРОВАТЬСЯ
   ============================================ */
codeSubmit.addEventListener('click', async function () {
  hideError();

  const pin = getPinValue();
  if (pin.length !== 4) {
    showError('Введите PIN из 4 цифр');
    return;
  }

  codeSubmit.disabled = true;
  codeSubmit.textContent = 'Проверяем...';

  try {
    if (isNewUser) {
      // РЕГИСТРАЦИЯ
      const name = nameInput.value.trim();
      if (name.length < 2) {
        showError('Введите имя (минимум 2 символа)');
        nameInput.focus();
        codeSubmit.disabled = false;
        codeSubmit.textContent = 'Войти';
        return;
      }

      const newUser = await createUser(name, currentPhone, pin);

      if (!newUser) {
        showError('Не удалось создать аккаунт. Попробуйте позже');
        codeSubmit.disabled = false;
        codeSubmit.textContent = 'Войти';
        return;
      }

      localStorage.setItem(CURRENT_USER_KEY, JSON.stringify({
        name: newUser.name,
        phone: newUser.phone,
        loginAt: new Date().toISOString()
      }));
    } else {
      // ВХОД
      const user = await findUserByPhone(currentPhone);

      if (!user) {
        showError('Пользователь не найден');
        codeSubmit.disabled = false;
        codeSubmit.textContent = 'Войти';
        return;
      }

      if (user.pin !== pin) {
        showError('Неверный PIN-код');
        clearPin();
        codeSubmit.disabled = false;
        codeSubmit.textContent = 'Войти';
        return;
      }

      localStorage.setItem(CURRENT_USER_KEY, JSON.stringify({
        name: user.name,
        phone: user.phone,
        loginAt: new Date().toISOString()
      }));
    }

    window.location.href = 'index.html';
  } catch (err) {
    console.error(err);
    showError('Ошибка. Попробуйте ещё раз');
    codeSubmit.disabled = false;
    codeSubmit.textContent = 'Войти';
  }
});

/* ============================================
   МАСКА ТЕЛЕФОНА
   ============================================ */
phoneInput.addEventListener('input', function () {
  phoneInput.value = maskPhone(phoneInput.value);
});
phoneInput.addEventListener('focus', function () {
  if (!phoneInput.value) phoneInput.value = '+7 (';
});
phoneInput.addEventListener('blur', function () {
  if (phoneInput.value === '+7 (' || phoneInput.value === '+7') {
    phoneInput.value = '';
  }
});

/* ============================================
   ИНИЦИАЛИЗАЦИЯ
   ============================================ */
phoneInput.focus();
</script>

</body>
</html>
